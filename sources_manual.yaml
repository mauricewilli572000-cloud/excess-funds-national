# Hand-managed sources and overrides for the nationwide excess funds scraper.
# Discovery (national.discover) finds most sources on its own and writes them to
# data/sources.json. Use this file when you want to:
#   - add a list discovery missed            (type: url)
#   - plug in one of your per-county scrapers (type: json_feed)
#   - approve / disable / relabel something discovery found (overrides)
#
# county_id is the 5-digit county FIPS code (it's shown on the dashboard's
# Sources view, and listed in data/counties.json).

sources:
  # Franklin County, OH — the dedicated franklin-excess-funds scraper (already
  # matched to Auditor / foreclosure addresses). skip_auto_sources stops the
  # nationwide crawler's copy of the same Clerk XLSX from double-counting.
  - id: franklin-oh-excess
    county_id: "39049"
    type: json_feed
    url: https://mauricewilli572000-cloud.github.io/franklin-excess-funds/excess_funds.json
    fund_type: foreclosure
    skip_auto_sources: true

  # Example of adding a list by hand (any PDF / Excel / CSV / web page):
  # - county_id: "39035"
  #   url: https://example.gov/excess-funds.pdf
  #   fund_type: foreclosure        # foreclosure | tax_sale
  #   status: verified

# Pages to start the crawler on for a county (5-digit FIPS -> list of URLs).
# Every PDF / Excel / CSV linked from these pages gets test-read.
discovery_hints:
  "39035":   # Cuyahoga County, OH — Clerk of Courts unapplied / excess funds lists
    - https://cuyahogacounty.gov/coc/excess-funds

# Approve or turn off a discovered source by its id (from the Sources view).
overrides:
  # --- Cuyahoga County, OH (Clerk of Courts excess funds page) ---
  3174126bb680:            # "Excess Funds - Foreclosure" (~6,000 rows, split name columns, Deposit + Bond)
    status: verified
    fund_type: foreclosure
  e7778108c068:            # "Excess Tax Foreclosure Funds released to Treasurer"
    status: verified
    fund_type: tax_sale
    lead_flag: Released to Treasurer   # claims go to the County Treasurer, not the Clerk
  aab49b7fdf2a:            # "Excess Funds - Non-Foreclosure": ordinary civil cases, not real estate
    status: disabled
  5ab5b2a25d9a:            # "Filing Fees/Court Costs" page — not a list
    status: disabled
  c26f8534cf06:            # the excess funds page itself (links to the lists above)
    status: disabled

