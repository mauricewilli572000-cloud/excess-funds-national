name: Discover excess funds sources

# Crawls the next COUNTIES_PER_RUN counties (oldest-checked first). Four runs a
# day x 150 counties = the whole country (~3,150 counties) in about 5-6 days,
# then each county is re-checked every RECRAWL_DAYS (30) days.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      state:
        description: "Optional: only these states, space separated (e.g. OH GA FL)"
        required: false
        default: ""
      limit:
        description: "Optional: number of counties this run"
        required: false
        default: ""
      county:
        description: "Optional: only these 5-digit county FIPS codes (e.g. 39035 = Cuyahoga)"
        required: false
        default: ""
      recheck:
        description: "Re-check counties even if they were crawled recently"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "excess-national-data"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build county seed list (first run, then monthly)
        run: |
          if [ ! -f data/counties.json ] || [ "$(date -u +%d)" = "01" ]; then python -m national.counties; fi
      - name: Discover
        env:
          PYTHONUNBUFFERED: "1"
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          RECRAWL_DAYS: ${{ github.event.inputs.recheck == 'true' && '0' || '30' }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.state }}" ]; then ARGS+=(--state ${{ github.event.inputs.state }}); fi
          if [ -n "${{ github.event.inputs.county }}" ]; then ARGS+=(--county ${{ github.event.inputs.county }}); fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS+=(--limit "${{ github.event.inputs.limit }}"); fi
          python -m national.discover "${ARGS[@]}"
      - name: Commit discovery results
        run: |
          git config user.name "excess-national-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/counties.json data/discovery_state.json data/sources.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Discovery batch: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          fi
