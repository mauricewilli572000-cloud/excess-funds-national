name: Cuyahoga docket address lookups

# Looks up Cuyahoga excess-funds cases on the Clerk's docket (property address +
# parcel) and the Fiscal Officer parcel record, biggest surplus first, ~100 min
# per run. Results cache in data/enrich/39035.json; the daily scrape applies them.
on:
  schedule:
    - cron: "7 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max cases this run"
        required: false
        default: "5000"
      cases:
        description: "Optional: only these case numbers (space separated), e.g. CV23976232"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "excess-national-enrich-cuyahoga"
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-22.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Look up cases
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=(--limit "${{ github.event.inputs.limit || '5000' }}" --minutes 100)
          if [ -n "${{ github.event.inputs.cases }}" ]; then ARGS+=(--case ${{ github.event.inputs.cases }}); fi
          python -m national.enrich_cuyahoga "${ARGS[@]}"
      - name: Commit lookups
        if: always()
        run: |
          git config user.name "excess-national-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enrich
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Cuyahoga docket lookups: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          fi
